<script>
const IRON_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSLrjvpRJiDnW7LX-jmINNBfQhr9DOyVXNQL5pqILl6M2kPXDQTDpxb9Rwdl2790cPIvD2BFqBtQyh9/pub?gid=0&single=true&output=csv";

let ironData=[];

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function parseCSV(text){
 const rows=[];
 let row=[],field="",quoted=false;

 for(let i=0;i<text.length;i++){
  const c=text[i],next=text[i+1];

  if(c==='"' && quoted && next==='"'){
   field+='"';i++;
  }else if(c==='"'){
   quoted=!quoted;
  }else if(c==="," && !quoted){
   row.push(field);field="";
  }else if((c==="\n" || c==="\r") && !quoted){
   if(c==="\r" && next==="\n")i++;
   row.push(field);
   if(row.some(v=>v.trim()!==""))rows.push(row);
   row=[];field="";
  }else{
   field+=c;
  }
 }
 row.push(field);
 if(row.some(v=>v.trim()!==""))rows.push(row);
 return rows;
}

async function loadIronDatabase(){
 const status=document.getElementById("dbStatus");
 const info=document.getElementById("dbInfo");

 try{
  const response=await fetch(IRON_URL,{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);

  const csv=await response.text();
  const rows=parseCSV(csv.replace(/^\uFEFF/,""));

  if(rows.length<2)throw new Error("لا توجد بيانات");

  ironData=rows.slice(1).map(r=>({
   factor:r[0]||"",
   factorAr:r[1]||"",
   code:r[2]||"",
   symptom:r[3]||"",
   symptomAr:r[4]||"",
   risk:r[5]||"",
   riskAr:r[6]||"",
   test:r[7]||"",
   testAr:r[8]||"",
   note:r[9]||"",
   noteAr:r[10]||"",
   source:r[11]||""
  }));

  status.textContent="تم الاتصال بنجاح. عدد السجلات: "+ironData.length;
  info.innerHTML="<p><b>العامل:</b> Iron Deficiency</p><p>قاعدة البيانات جاهزة للاستخدام.</p>";
  updateTests();

 }catch(error){
  status.textContent="تعذر تحميل قاعدة البيانات. تحقق من الإنترنت ورابط النشر.";
  console.error(error);
 }
}

function normalizeText(value){
 return String(value||"")
  .toLowerCase()
  .replace(/[ًٌٍَُِّْـ]/g,"")
  .replace(/[أإآ]/g,"ا")
  .replace(/ة/g,"ه")
  .replace(/ى/g,"ي")
  .trim();
}

function searchIronDatabase(terms){
 const normalized=terms.map(normalizeText).filter(Boolean);

 return ironData.filter(item=>{
  const content=normalizeText(
   item.symptomAr+" "+item.symptom+" "+
   item.riskAr+" "+item.risk+" "+
   item.noteAr+" "+item.note
  );

  return normalized.some(term=>
   term.length>2 && content.includes(term)
  );
 });
}

function showDatabaseMatches(matches){
 if(!matches.length){
  return "<p>لم يتم العثور على سجل مطابق مباشرة في قاعدة البيانات.</p>";
 }

 let html="<h4>المعلومات المسترجعة من قاعدة بيانات الحديد</h4>";

 matches.forEach(item=>{
  html+=`
   <div class="data-item">
    <b>العامل:</b> ${escapeHTML(item.factorAr||item.factor)}
    <br><b>العرض:</b> ${escapeHTML(item.symptomAr||item.symptom)}
    <br><b>عامل الخطورة:</b> ${escapeHTML(item.riskAr||item.risk)}
    <br><b>الفحص:</b> ${escapeHTML(item.testAr||item.test)}
    <br><b>الملاحظة:</b> ${escapeHTML(item.noteAr||item.note)}
   </div>
  `;
 });

 return html;
}

function getTestsHTML(){
 const tests=[...new Set(
  ironData
   .map(item=>item.testAr||item.test)
   .filter(Boolean)
 )];

 if(!tests.length){
  return `
   <p>CBC - صورة الدم الكاملة</p>
   <p>Serum Ferritin - مخزون الحديد</p>
   <p>Serum Iron - الحديد في مصل الدم</p>
   <p>TIBC - السعة الكلية لارتباط الحديد</p>
   <p>Transferrin Saturation - نسبة تشبع الترانسفيرين</p>
  `;
 }

 return tests.map(t=>"<p>"+escapeHTML(t)+"</p>").join("");
}

function updateTests(){
 document.getElementById("tests").innerHTML=getTestsHTML();
}

// القسم الأول: كتابة الأعراض
function evaluateSymptoms(){
 const input=document.getElementById("symptoms").value.trim();
 const result=document.getElementById("symptomResult");

 if(!input){
  alert("يرجى كتابة الأعراض أولاً");
  return;
 }

 const text=normalizeText(input);

 const symptomGroups=[
  ["تعب","ارهاق","خمول","اجهاد"],
  ["دوخه","دوار"],
  ["صداع"],
  ["تساقط الشعر","تساقط"],
  ["شحوب"],
  ["ضيق التنفس","صعوبه التنفس"],
  ["خفقان"],
  ["اظافر","تكسر الاظافر","ضعف الاظافر"]
 ];

 const found=symptomGroups.filter(group=>
  group.some(word=>text.includes(normalizeText(word)))
 );

 const terms=found.flat();
 const matches=searchIronDatabase(terms);

 result.style.display="block";

 let html="<h3>نتيجة التقييم الأولي</h3>";

 if(found.length){
  html+="<p>تم التعرف على "+found.length+" مجموعات من الأعراض.</p>";
  html+="<p><b>الأعراض:</b> "+terms.map(escapeHTML).join("، ")+"</p>";
  html+="<p>قد تتوافق هذه الأعراض مع نقص الحديد، لكنها ليست خاصة به.</p>";
 }else{
  html+="<p>لم يتم التعرف على أعراض من القائمة الأولية. هذا لا ينفي نقص الحديد.</p>";
 }

 html+=showDatabaseMatches(matches);
 html+="<p><b>الفحوصات المقترحة:</b></p>"+getTestsHTML();
 html+="<p>يجب تفسير النتائج مع مختص صحي.</p>";

 result.innerHTML=html;
 result.scrollIntoView({behavior:"smooth",block:"center"});
}

// القسم الثاني: التقييم بالاختيارات
function evaluateOptions(){
 const result=document.getElementById("optionResult");
 const age=document.getElementById("age").value;
 const gender=document.getElementById("gender").value;

 if(!age || age<1 || age>120 || !gender){
  alert("يرجى إدخال العمر والجنس");
  return;
 }

 let symptomScore=0;
 let riskScore=0;
 let terms=[];

 const questionTerms={
  1:["تعب","ارهاق"],
  2:["دوخه","صداع"],
  3:["تساقط الشعر"],
  4:["شحوب"],
  5:["ضيق التنفس"],
  6:["خفقان"],
  7:["تكسر الاظافر"],
  8:["قلة تناول الحديد"],
  9:["نظام غذائي نباتي"]
 };

 for(let i=1;i<=9;i++){
  const answer=document.querySelector(
   'input[name="q'+i+'"]:checked'
  );

  if(!answer){
   alert("يرجى الإجابة عن جميع الأسئلة");
   return;
  }

  if(answer.value==="1"){
   if(i<=7)symptomScore++;
   else riskScore++;

   terms.push(...questionTerms[i]);
  }
 }

 const matches=searchIronDatabase(terms);

 let assessment="";

 if(symptomScore===0 && riskScore===0){
  assessment="لم تظهر مؤشرات إيجابية ضمن الإجابات.";
 }else if(symptomScore>0 && riskScore===0){
  assessment="توجد أعراض تستحق التحقق من أسبابها.";
 }else if(symptomScore===0 && riskScore>0){
  assessment="توجد عوامل خطورة غذائية محتملة.";
 }else{
  assessment="توجد أعراض وعوامل خطورة تستحق التقييم.";
 }

 result.style.display="block";

 let html=`
  <h3>نتيجة التقييم الأولي</h3>
  <p><b>العمر:</b> ${escapeHTML(age)}</p>
  <p><b>الجنس:</b> ${gender==="female"?"أنثى":"ذكر"}</p>
  <p><b>الأعراض المسجلة:</b> ${symptomScore} من 7</p>
  <p><b>عوامل الخطورة:</b> ${riskScore} من 2</p>
  <p><b>التقييم:</b> ${assessment}</p>
 `;

 html+=showDatabaseMatches(matches);
 html+="<p><b>الفحوصات المقترحة:</b></p>"+getTestsHTML();
 html+="<p>هذه النتيجة وصف للإجابات وليست تشخيصاً أو نسبة احتمال للإصابة بنقص الحديد.</p>";

 result.innerHTML=html;
 result.scrollIntoView({behavior:"smooth",block:"center"});
}

loadIronDatabase();

</script>
</body>
</html>
